<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<div id="app" class="app"><section style="max-width:760px;margin:35px auto;padding:24px;border-radius:20px;background:#fff;border:1px solid #e7eaff;font-family:Tahoma,Arial,sans-serif;line-height:1.9;color:#202747"><h2 style="margin-top:0">در حال بارگذاری کلاس شاد من…</h2><p>اگر این پیام باقی ماند، اجرای JavaScript با خطا روبه‌رو شده است. جزئیات خطا در همین صفحه نمایش داده می‌شود.</p></section></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
// گزارشگر خطای اولیه؛ اگر اسکریپت اصلی اجرا نشود، به‌جای صفحه سفید خطا را نمایش می‌دهد.
(function () {
  function showStartupError(title, detail) {
    var app = document.getElementById('app');
    if (!app) return;
    var box = document.createElement('section');
    box.style.cssText = 'max-width:760px;margin:25px auto;padding:24px;border-radius:20px;background:#fff;border:2px solid #ffd2dc;font-family:Tahoma,Arial,sans-serif;line-height:1.9;color:#202747;direction:rtl;box-shadow:0 12px 35px rgba(48,62,130,.10)';
    var h = document.createElement('h2'); h.textContent = title; h.style.color = '#b3294d';
    var p = document.createElement('p'); p.textContent = 'برنامه به‌جای صفحه سفید، این خطا را برای عیب‌یابی نشان می‌دهد:';
    var pre = document.createElement('pre'); pre.textContent = detail || 'جزئیات خطا از مرورگر دریافت نشد.'; pre.style.cssText = 'direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff5f7;padding:12px;border-radius:10px';
    var tip = document.createElement('p'); tip.textContent = 'لطفاً همین پیام را برای پشتیبانی بفرستید. کلید عمومی یا رمز عبور را در پیام قرار ندهید.';
    box.appendChild(h); box.appendChild(p); box.appendChild(pre); box.appendChild(tip);
    app.replaceChildren(box);
  }
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target !== window) return;
    var detail = (e && e.message ? e.message : 'JavaScript error') + (e && e.filename ? '\nFile: ' + e.filename : '') + (e && e.lineno ? '\nLine: ' + e.lineno : '') + (e && e.colno ? '\nColumn: ' + e.colno : '');
    showStartupError('خطا در اجرای برنامه', detail);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e && e.reason;
    showStartupError('خطای درخواست یا عملیات ناموفق', reason && (reason.stack || reason.message) ? (reason.stack || reason.message) : String(reason || 'Promise rejection'));
  });
})();
</script>
<script>
'use strict';
// تنظیمات اتصال آزمایشی Supabase در LocalStorage ذخیره می‌شوند.
// کلید Publishable عمومی است؛ هرگز service_role یا کلید secret را وارد نکنید.
const SUPABASE_CONFIG_STORE_KEY = 'kelas_shad_supabase_config_v1';
// پیش از انتشار عمومی، کلید Publishable پروژه را در مقدار زیر قرار دهید.
// این کلید عمومی است؛ هرگز کلید Secret یا service_role را جایگزین آن نکنید.
const DEFAULT_SUPABASE_URL = 'https://pyfejniopwdqtoclchux.supabase.co';
const DEFAULT_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_zgSW7HMnJ9lKCuXIwdcHfA_kIyIkD0Y';
function loadSupabaseConfig() {
  try {
    const value = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_STORE_KEY) || '{}');
    return {
      url: typeof value.url === 'string' && value.url ? value.url : DEFAULT_SUPABASE_URL,
      key: typeof value.key === 'string' && value.key ? value.key : DEFAULT_SUPABASE_PUBLISHABLE_KEY
    };
  } catch (_) {
    return { url: '', key: '' };
  }
}
function setSupabaseTestStatus(message, kind = 'info') {
  const node = document.querySelector('#supabase-test-status');
  if (!node) return;
  node.className = 'notice ' + (kind === 'success' ? 'success' : kind === 'error' ? 'danger-notice' : 'info');
  node.textContent = message;
}
// کلاینت اصلی Supabase؛ نشست ورود معلم برای عملیات آنلاین در همین مرورگر نگهداری می‌شود.
let activeSupabaseClient = null;
let activeSupabaseClientKey = '';
let questionSyncInFlight = false;
let questionRemoteAutoLoadDone = false;
let questionCloudState = { connected: false, userId: '', rowCount: 0, message: 'برای مدیریت آنلاین سؤال‌ها، ابتدا در تنظیمات اتصال را آزمایش کنید.', kind: 'info' };
let examSyncInFlight = false;
let examRemoteAutoLoadDone = false;
let examCloudState = { connected: false, rowCount: 0, message: 'پس از اتصال معلم، آزمون‌های آنلاین از پایگاه داده دریافت می‌شوند.', kind: 'info' };

function isUuid(value) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ''));
}
function isSupabaseConfigured() {
  const c = loadSupabaseConfig();
  return Boolean(c.url && c.key && !/PASTE_YOUR_PUBLISHABLE_KEY_HERE/i.test(c.key));
}
function getSupabaseClient(urlOverride, keyOverride) {
  const stored = loadSupabaseConfig();
  const url = String(urlOverride ?? stored.url).trim().replace(/\/$/, '');
  const key = String(keyOverride ?? stored.key).trim();
  if (!url || !key) return null;
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    throw new Error('کتابخانه Supabase بارگذاری نشده است. اتصال اینترنت و بارگذاری صفحه را بررسی کنید.');
  }
  const cacheKey = url + '|' + key;
  if (activeSupabaseClient && activeSupabaseClientKey === cacheKey) return activeSupabaseClient;
  activeSupabaseClient = window.supabase.createClient(url, key, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      storageKey: 'kelas_shad_supabase_auth_v1'
    }
  });
  activeSupabaseClientKey = cacheKey;
  return activeSupabaseClient;
}
async function getAuthenticatedSupabaseContext() {
  const config = loadSupabaseConfig();
  if (!config.url || !config.key) {
    throw new Error('ابتدا در بخش تنظیمات، Project URL و کلید عمومی Supabase را ثبت و اتصال را آزمایش کنید.');
  }
  const client = getSupabaseClient(config.url, config.key);
  const { data, error } = await client.auth.getUser();
  if (error) throw new Error('بررسی نشست معلم ناموفق بود: ' + error.message);
  if (!data || !data.user) {
    throw new Error('ورود آنلاین معلم فعال نیست. به تنظیمات بروید و آزمایش اتصال را با ایمیل و رمز حساب Supabase انجام دهید.');
  }
  return { client, user: data.user };
}
async function invokeStudentApi(action, payload = {}) {
  if (!isSupabaseConfigured()) {
    throw new Error('اتصال آنلاین برای این دستگاه تنظیم نشده است. پیش از انتشار، Project URL و Publishable key را در ابتدای فایل HTML تنظیم کنید.');
  }
  const config = loadSupabaseConfig();
  const client = getSupabaseClient(config.url, config.key);
  const { data, error } = await client.functions.invoke('student-api', {
    body: { action, ...payload }
  });
  if (error) {
    let message = error.message || 'درخواست به سرویس آنلاین ناموفق بود.';
    try {
      if (error.context && typeof error.context.json === 'function') {
        const detail = await error.context.json();
        if (detail && (detail.error || detail.message)) message = detail.error || detail.message;
      }
    } catch (_) {}
    throw new Error(message);
  }
  if (data && data.error) throw new Error(data.error);
  return data || {};
}
function readSavedStudentSession() {
  try { const x = JSON.parse(sessionStorage.getItem('kelas_shad_student_session_v1') || 'null'); return x && x.token ? x : null; }
  catch (_) { return null; }
}
function clearStudentSession() {
  studentSession = null; activeOnlineSubmission = null; studentRemoteSubmissions = [];
  try { sessionStorage.removeItem('kelas_shad_student_session_v1'); } catch (_) {}
}
function saveStudentSession(value) {
  studentSession = value;
  try { sessionStorage.setItem('kelas_shad_student_session_v1', JSON.stringify(value)); } catch (_) {}
}
function mapStudentQuestion(q) {
  const typeMap = { multiple_choice: 'mcq', true_false: 'tf', short_text: 'short', fill_blank: 'fill' };
  return {
    id: q.examQuestionId, examQuestionId: q.examQuestionId,
    code: q.code || '', type: typeMap[q.questionType] || 'short',
    text: q.text || '', options: Array.isArray(q.options) ? q.options : [],
    // پاسخ صحیح عمداً از Edge Function به مرورگر دانش‌آموز ارسال نمی‌شود.
    correct: '', points: Number(q.points ?? 1), help: '', active: true,
    subject: q.subject || 'عمومی', onlineStudentQuestion: true
  };
}
function normalizeAnswerValue(value) {
  if (value == null) return '';
  if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value);
  if (typeof value === 'object' && Object.prototype.hasOwnProperty.call(value, 'answer')) return String(value.answer ?? '');
  return JSON.stringify(value);
}
function mapTeacherQuestionType(type) {
  return ({ multiple_choice: 'mcq', true_false: 'tf', short_text: 'short', fill_blank: 'fill' })[type] || 'short';
}
function calculateTeacherAutoGrade(answer, snapshot, points) {
  const type = snapshot && snapshot.question_type;
  const correctRaw = snapshot && snapshot.correct_answer;
  let correctExpected = correctRaw;
  if (correctExpected && typeof correctExpected === 'object' && Object.prototype.hasOwnProperty.call(correctExpected, 'answer')) correctExpected = correctExpected.answer;
  const auto = ['multiple_choice', 'true_false'].includes(type) && correctExpected != null;
  const isCorrect = auto && normalizeAnswerValue(answer).trim().toLocaleLowerCase('fa-IR') === normalizeAnswerValue(correctExpected).trim().toLocaleLowerCase('fa-IR');
  const scorePoints = Number(points ?? snapshot?.default_points ?? 1) || 0;
  return { autoGraded: auto, correct: auto ? isCorrect : null, earned: auto && isCorrect ? scorePoints : 0, max: auto ? scorePoints : 0 };
}

function mapQuestionFromSupabase(row) {
  const typeMap = { multiple_choice: 'mcq', true_false: 'tf', fill_blank: 'fill', short_text: 'short' };
  let correct = row.correct_answer;
  if (correct && typeof correct === 'object') {
    if (Object.prototype.hasOwnProperty.call(correct, 'answer')) correct = correct.answer;
    else correct = JSON.stringify(correct);
  }
  return {
    id: row.id,
    code: row.code,
    type: typeMap[row.question_type] || 'short',
    text: row.question_text || '',
    options: Array.isArray(row.options) ? row.options : [],
    correct: correct == null ? '' : String(correct),
    points: Number(row.default_points ?? 1),
    help: row.explanation || '',
    active: row.is_active !== false,
    subject: row.subject || 'عمومی',
    createdAt: row.created_at || new Date().toISOString(),
    updatedAt: row.updated_at || new Date().toISOString()
  };
}
function mapQuestionToSupabase(q, teacherId) {
  const typeMap = { mcq: 'multiple_choice', tf: 'true_false', fill: 'fill_blank', short: 'short_text' };
  return {
    teacher_id: teacherId,
    code: String(q.code).trim().toUpperCase(),
    subject: q.subject || 'عمومی',
    question_text: String(q.text || '').trim(),
    question_type: typeMap[q.type] || 'short_text',
    options: Array.isArray(q.options) ? q.options : [],
    correct_answer: q.correct === '' || q.correct == null ? null : String(q.correct),
    explanation: q.help || null,
    default_points: Number(q.points ?? 1),
    is_active: q.active !== false
  };
}

async function runSupabaseConnectionTest(email, password, urlOverride, keyOverride) {
  const stored = loadSupabaseConfig();
  const url = String(urlOverride ?? stored.url).trim();
  const key = String(keyOverride ?? stored.key).trim();
  const safeEmail = String(email || '').trim();
  const safePassword = String(password || '');
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    throw new Error('کتابخانه Supabase بارگذاری نشده است. اتصال اینترنت و بارگذاری صفحه را بررسی کنید.');
  }
  if (!url || !key) throw new Error('ابتدا Project URL و Publishable key را وارد کنید.');
  if (!safeEmail || !safePassword) throw new Error('ایمیل و رمز حساب معلم را وارد کنید.');
  let parsed;
  try { parsed = new URL(url); } catch (_) {
    throw new Error('Project URL معتبر نیست. آدرس کامل مانند https://xxxx.supabase.co را وارد کنید.');
  }
  if (parsed.protocol !== 'https:' && !(parsed.protocol === 'http:' && ['localhost', '127.0.0.1'].includes(parsed.hostname))) {
    throw new Error('برای Supabase از آدرس HTTPS استفاده کنید.');
  }
  if (/service_role|secret/i.test(key)) throw new Error('فقط Publishable key یا anon key عمومی را وارد کنید؛ کلید secret ممنوع است.');
  // پیکربندی را ذخیره می‌کنیم تا کلاینت اصلی و نشست تأییدشده برای مدیریت سؤال‌ها هم استفاده شوند.
  localStorage.setItem(SUPABASE_CONFIG_STORE_KEY, JSON.stringify({ url: url.replace(/\/$/, ''), key }));
  const client = getSupabaseClient(url, key);
  const { data: authData, error: loginError } = await client.auth.signInWithPassword({ email: safeEmail, password: safePassword });
  if (loginError) throw new Error('ورود معلم ناموفق بود: ' + loginError.message);
  const { data: questions, error: queryError } = await client.from('questions').select('id').limit(5);
  if (queryError) throw new Error('ورود موفق بود، اما خواندن جدول questions خطا داد: ' + queryError.message);
  questionCloudState = { connected: true, userId: authData.user.id, rowCount: Array.isArray(questions) ? questions.length : 0, message: 'اتصال آنلاین آماده است. از بخش «سؤال‌ها» برای مدیریت بانک سؤال آنلاین استفاده کنید.', kind: 'success' };
  questionRemoteAutoLoadDone = false;
  examRemoteAutoLoadDone = false;
  studentsRemoteAutoLoadDone = false;
  submissionsRemoteAutoLoadDone = false;
  return { count: Array.isArray(questions) ? questions.length : 0, userId: authData.user.id };
}
window.testSupabaseConnection = async function (email, password) {
  const result = await runSupabaseConnectionTest(email, password);
  console.log('Supabase connection test succeeded. Visible question rows:', result.count);
  alert('اتصال موفق بود. تعداد سؤال‌های قابل مشاهده: ' + result.count);
  return result;
};

async function refreshRemoteQuestions(showToast = true) {
  if (questionSyncInFlight) return;
  questionSyncInFlight = true;
  try {
    const localOnlyBefore = db.questions.filter(q => !isUuid(q.id));
    const { client, user } = await getAuthenticatedSupabaseContext();
    const { data, error } = await client.from('questions').select('*').eq('teacher_id', user.id).order('created_at', { ascending: false });
    if (error) throw error;
    const remoteQuestions = (data || []).map(mapQuestionFromSupabase);
    const remoteCodes = new Set(remoteQuestions.map(q => String(q.code).toUpperCase()));
    const unsyncedLocal = localOnlyBefore.filter(q => !remoteCodes.has(String(q.code).toUpperCase()));
    db.questions = [...remoteQuestions, ...unsyncedLocal];
    questionCloudState = {
      connected: true,
      userId: user.id,
      rowCount: remoteQuestions.length,
      message: remoteQuestions.length
        ? `اتصال آنلاین برقرار است؛ ${faNum(remoteQuestions.length)} سؤال از پایگاه داده دریافت شد.` + (unsyncedLocal.length ? ` ${faNum(unsyncedLocal.length)} سؤال محلی هنوز منتقل نشده است.` : '')
        : `اتصال آنلاین برقرار است، اما جدول questions هنوز سؤال ندارد.${unsyncedLocal.length ? ` ${faNum(unsyncedLocal.length)} سؤال در همین مرورگر محلی است و هنوز در پایگاه آنلاین ذخیره نشده است.` : ''}`,
      kind: 'success'
    };
    persist();
    if (showToast) toast('فهرست سؤال‌ها از پایگاه داده به‌روز شد.');
  } catch (error) {
    questionCloudState = { ...questionCloudState, connected: false, message: error.message || 'دریافت سؤال‌ها ناموفق بود.', kind: 'error' };
    if (showToast) toast(questionCloudState.message);
  } finally {
    questionSyncInFlight = false;
    if (adminLogged && adminTab === 'questions') adminDashboard();
  }
}
async function syncLocalQuestionsToSupabase() {
  if (!confirm('سؤال‌های ذخیره‌شده در این مرورگر به حساب معلم فعلی در پایگاه آنلاین منتقل شوند؟')) return;
  try {
    const { client, user } = await getAuthenticatedSupabaseContext();
    const localOnly = db.questions.filter(q => !isUuid(q.id));
    if (!localOnly.length) { toast('سؤال محلی برای انتقال وجود ندارد.'); return; }
    const { data: existing, error: existingError } = await client.from('questions').select('*').eq('teacher_id', user.id);
    if (existingError) throw existingError;
    const existingRows = existing || [];
    const byCode = new Map(existingRows.map(row => [String(row.code).toUpperCase(), row]));
    const toInsert = localOnly.filter(q => !byCode.has(String(q.code).toUpperCase()));
    let insertedRows = [];
    if (toInsert.length) {
      const { data, error } = await client.from('questions').insert(toInsert.map(q => mapQuestionToSupabase(q, user.id))).select('*');
      if (error) throw error;
      insertedRows = data || [];
      insertedRows.forEach(row => byCode.set(String(row.code).toUpperCase(), row));
    }
    const idMap = new Map();
    localOnly.forEach(q => {
      const match = byCode.get(String(q.code).toUpperCase());
      if (match) idMap.set(q.id, match.id);
    });
    db.exams.forEach(ex => { ex.questionIds = (ex.questionIds || []).map(id => idMap.get(id) || id); });
    db.submissions.forEach(sub => (sub.answers || []).forEach(a => { a.questionId = idMap.get(a.questionId) || a.questionId; }));
    db.questions = [...byCode.values()].map(mapQuestionFromSupabase).sort((a, b) => String(a.code).localeCompare(String(b.code)));
    persist();
    questionCloudState = { connected: true, userId: user.id, rowCount: db.questions.length, message: `انتقال انجام شد. ${faNum(insertedRows.length)} سؤال جدید در پایگاه آنلاین ذخیره شد.`, kind: 'success' };
    toast(questionCloudState.message);
  } catch (error) {
    console.error('Sync local questions failed:', error);
    questionCloudState = { ...questionCloudState, message: 'انتقال سؤال‌ها انجام نشد: ' + (error.message || String(error)), kind: 'error' };
    toast(questionCloudState.message);
  }
  if (adminLogged && adminTab === 'questions') adminDashboard();
}

async function handleStudentLogin(e){
  e.preventDefault();
  const fd=new FormData(e.currentTarget),classCode=String(fd.get('classCode')||'').trim(),code=String(fd.get('studentCode')||'').trim();
  const button=e.currentTarget.querySelector('button[type="submit"]');
  if(button){button.disabled=true;button.textContent='در حال ورود...';}
  try {
    if(isSupabaseConfigured()){
      const pin=String(fd.get('pin')||'').trim();
      if(!classCode||!code||!pin)throw new Error('کد کلاس، کد دانش‌آموز و PIN را کامل وارد کن.');
      const data=await invokeStudentApi('student-login',{classCode,studentCode:code,pin});
      saveStudentSession({token:data.token,expiresAt:data.expiresAt});
      currentStudent={id:data.student.id,name:data.student.fullName,code:data.student.studentCode,classId:data.student.classId,className:data.student.className,classCode:data.student.classCode,online:true};
      await loadOnlineStudentData();
      toast('ورود آنلاین موفق بود.');
      await studentDashboard();
      return;
    }
    // حالت محلی فقط برای آزمایش؛ امن نیست و بین دستگاه‌ها همگام نمی‌شود.
    const name=String(fd.get('studentName')||'').trim();
    if(classCode.toLowerCase()!==String(db.settings.classCode).trim().toLowerCase()){toast('کد کلاس درست نیست.');return;}
    if(code.length<3||name.length<3){toast('نام و کد دانش‌آموز را بررسی کن.');return;}
    let st=db.students.find(x=>String(x.code).toLowerCase()===code.toLowerCase()&&x.className===db.settings.className);
    if(st){if(!st.active){toast('این حساب دانش‌آموزی غیرفعال است.');return;}if(st.name.trim().toLowerCase()!==name.toLowerCase()){toast('نام واردشده با این کد هم‌خوانی ندارد.');return;}}
    else {if(db.students.some(x=>String(x.code).toLowerCase()===code.toLowerCase())){toast('این کد قبلاً برای کلاس یا دانش‌آموز دیگری ثبت شده است.');return;}st={id:uid('stu'),name,className:db.settings.className,code,active:true,createdAt:new Date().toISOString()};db.students.push(st);persist();toast('ثبت‌نام محلی انجام شد.');}
    currentStudent={id:st.id,name:st.name,className:st.className,code:st.code};
    await studentDashboard();
  } catch(error) {
    console.error('Student login failed:',error);
    toast('ورود ناموفق بود: '+(error.message||String(error)));
  } finally { if(button){button.disabled=false;button.textContent='ورود به کلاس 🎈';} }
}
async function loadOnlineStudentData(){
  const data=await invokeStudentApi('student-data',{studentToken:studentSession?.token});
  currentStudent={id:data.student.id,name:data.student.fullName,code:data.student.studentCode,classId:data.student.classId,className:data.student.className,classCode:data.student.classCode,online:true};
  const newQuestions=[];
  const newExams=(data.exams||[]).map(ex=>{
    const qs=(ex.questions||[]).map(raw=>{
      const q=mapStudentQuestion(raw);q.onlineStudentQuestion=true;newQuestions.push(q);return q;
    });
    return {id:ex.id,title:ex.title,lesson:ex.subject||'عمومی',subject:ex.subject||'عمومی',description:ex.description||'',classId:currentStudent.classId,className:currentStudent.className,classCode:currentStudent.classCode,active:true,status:'published',questionIds:qs.map(q=>q.id),allowRetakes:!!ex.allowRetakes,online:true,onlineStudentExam:true,createdAt:ex.createdAt||new Date().toISOString()};
  });
  db.questions=newQuestions;db.exams=newExams;
  const examNames=new Map(newExams.map(ex=>[ex.id,ex.title]));
  studentRemoteSubmissions=(data.submissions||[]).map(row=>({
  id:row.receiptCode||row.id,
  dbId:row.id,
  studentId:currentStudent.id,
  studentName:currentStudent.name,
  className:currentStudent.className,
  examId:row.examId,
  examTitle:row.examTitle||examNames.get(row.examId)||'آزمون',
  submittedAt:row.submittedAt||row.createdAt||new Date().toISOString(),
  submittedAtLabel:row.submittedAt?new Date(row.submittedAt).toLocaleString('fa-IR'):'در حال پاسخ‌گویی',
  answers:[],
  online:true,
  status:row.status,
  receiptCode:row.receiptCode,
  autoScore:Number(row.autoScore||0),
  autoMax:Number(row.autoMax||0),
  teacherScore:Number(row.teacherScore||0),
  totalScore:Number(row.totalScore||0),
  totalMax:Number(row.totalMax||0),
  reviewed:row.status==='graded',
  feedback:Array.isArray(row.feedback)?row.feedback:[],
  teacherFeedback:(row.feedback||[]).map(item=>item.feedback).filter(Boolean).join(' · ')
}));
  return data;
}

  </section><section class="section"><div class="section-head"><h3>پاسخ‌نامه‌های من</h3><span class="muted small">${faNum(mySubs.filter(x=>x.status==='submitted'||x.status==='graded'||!x.status).length)} ثبت</span></div>
  ${mySubs.filter(x=>x.status==='submitted'||x.status==='graded'||!x.status).length?`<div class="table-wrap"><table><thead><tr><th>شناسه</th><th>آزمون</th><th>تاریخ ثبت</th><th>وضعیت</th><th>نمره و بازخورد معلم</th></tr></thead><tbody>${mySubs.filter(x=>x.status==='submitted'||x.status==='graded'||!x.status).map(sub=>`<tr><td><span class="code-badge">${esc(sub.id)}</span></td><td>${esc((db.exams.find(ex=>ex.id===sub.examId)||{}).title||sub.examTitle||'آزمون')}</td><td>${esc(sub.submittedAtLabel||'')}</td><td>${sub.status==='graded'?'<span class="badge green">بررسی‌شده</span>':'<span class="badge orange">در انتظار بررسی</span>'}</td><td>${sub.status==='graded'?`<strong>نمره نهایی: ${faNum(Number(sub.totalScore||0))} از ${faNum(Number(sub.totalMax||0))}</strong><p>${esc(sub.teacherFeedback||'نظر نوشتاری ثبت نشده است.')}</p>`:'پس از بررسی معلم نمایش داده می‌شود.'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">هنوز پاسخ‌نامه‌ای ثبت نکرده‌ای.</div>'}</section>`);
}
function studentLogoutToLogin(){clearStudentSession();currentStudent=null;activeExam=null;studentLoginPage()}
async function startExam(examId){
  const ex=db.exams.find(e=>String(e.id)===String(examId));
  if(!ex||!ex.active){toast('این آزمون فعال نیست.');return;}
  const qs=activeQuestions(ex);
  if(!qs.length){toast('این آزمون سؤال فعالی ندارد.');return;}
  activeExam=ex;attemptAnswers={};attemptIndex=0;attemptStartedAt=new Date().toISOString();activeOnlineSubmission=null;
  if(studentSession&&studentSession.token){
    try {
      const started=await invokeStudentApi('start-exam',{studentToken:studentSession.token,examId:ex.id});
      activeOnlineSubmission=started.submission;
      const existingAnswers=started.answers||[];
      existingAnswers.forEach(a=>{attemptAnswers[a.examQuestionId]=normalizeAnswerValue(a.answerValue);});
      attemptStartedAt=activeOnlineSubmission.startedAt||attemptStartedAt;
    } catch(error) { console.error('Start online exam failed:',error);toast('شروع آزمون ناموفق بود: '+(error.message||String(error)));return; }
  } else {
    if(!db.settings.allowRetry&&db.submissions.some(x=>x.studentId===currentStudent.id&&x.examId===examId)){toast('برای این آزمون قبلاً پاسخ ثبت کرده‌ای.');return;}
    try{const key=STORE_KEY+'_draft_'+(currentStudent?.id||'')+'_'+(activeExam?.id||'');const raw=localStorage.getItem(key);if(raw&&confirm('برای این آزمون پاسخ‌های ذخیره‌نشده پیدا شد. می‌خواهی ادامه بدهی؟')){const draft=JSON.parse(raw);attemptAnswers=draft.answers&&typeof draft.answers==='object'?draft.answers:{};attemptIndex=Number.isInteger(draft.index)?draft.index:0;attemptStartedAt=draft.started||attemptStartedAt}}catch(e){}
  }
  view='exam';renderExam();
}
function renderExam(){if(!activeExam||!currentStudent){studentDashboard();return}const qs=activeQuestions(activeExam);if(!qs.length){toast('در این آزمون سؤال فعالی پیدا نشد.');studentDashboard();return}attemptIndex=Math.max(0,Math.min(attemptIndex,qs.length-1));const q=qs[attemptIndex];const value=attemptAnswers[q.id]??'';let answerHtml='';if(q.type==='mcq'||q.type==='tf'){answerHtml=`<div class="option-list">${q.options.map((o,i)=>`<button type="button" class="option ${String(value)===String(o)?'selected':''}" data-answer-q="${esc(q.id)}" data-answer-val="${esc(o)}"><span class="letter">${faNum(i+1)}</span>${esc(o)}</button>`).join('')}</div>`}else{answerHtml=`<div class="field"><label for="shortAnswer">پاسخ خود را بنویس</label><textarea id="shortAnswer" rows="3" placeholder="پاسخت را اینجا بنویس..." data-text-answer-q="${esc(q.id)}">${esc(value)}</textarea></div>`}shell(`${viewHead(activeExam.title,'دانش‌آموز: '+currentStudent.name+' · '+activeExam.lesson)}<section class="panel"><div class="question-top"><span>سؤال ${faNum(attemptIndex+1)} از ${faNum(qs.length)}</span><span class="code-badge">${esc(q.code)}</span><span class="badge">${faNum(q.points||1)} نمره</span></div><div class="progress"><span style="width:${((attemptIndex+1)/qs.length)*100}%"></span></div><article class="question-card"><div class="question-top"><span>${esc(typeName(q.type))}</span><span>🌟 با دقت فکر کن</span></div><h3>${esc(q.text)}</h3>${answerHtml}${q.help?`<div class="notice info">💡 راهنما: ${esc(q.help)}</div>`:''}</article><div class="question-nav"><button class="btn ghost" onclick="previousQuestion()" ${attemptIndex===0?'disabled':''}>→ سؤال قبلی</button><span class="muted small">${faNum(Object.keys(attemptAnswers).filter(id=>String(attemptAnswers[id]).trim()!=='').length)} پاسخ از ${faNum(qs.length)}</span>${attemptIndex<qs.length-1?`<button class="btn primary" onclick="nextQuestion()">سؤال بعدی ←</button>`:`<button class="btn teal" onclick="reviewAttempt()">مرور پاسخ‌ها ✓</button>`}</div><div class="foot-actions"><button class="btn danger" onclick="confirmExitExam()">خروج از آزمون</button><button class="btn secondary" onclick="reviewAttempt()">مرور همه پاسخ‌ها</button></div></section>`);$$('[data-answer-q]').forEach(btn=>btn.addEventListener('click',()=>setAnswer(btn.dataset.answerQ,btn.dataset.answerVal)));const ta=$('[data-text-answer-q]');if(ta)ta.addEventListener('input',()=>setTextAnswer(ta.dataset.textAnswerQ,ta.value))}
function setAnswer(qid,val){attemptAnswers[qid]=String(val);persistDraft();renderExam()}
function setTextAnswer(qid,val){attemptAnswers[qid]=val;persistDraft()}
function persistDraft(){try{localStorage.setItem(STORE_KEY+'_draft_'+(currentStudent?.id||'')+'_'+(activeExam?.id||''),JSON.stringify({answers:attemptAnswers,index:attemptIndex,started:attemptStartedAt}))}catch(e){}}

<button class="btn ghost" onclick="backToExam()">بازگشت به سؤال‌ها</button>
<button class="btn danger" onclick="confirmExitExam()">خروج از آزمون</button>

async function ensureRemoteClass(client,user,className){
  const name=String(className||db.settings.className||'دوم الف').trim();
  if(!name)throw new Error('نام کلاس را وارد کنید.');
  const {data:existing,error:findError}=await client.from('classes').select('id,name,class_code,is_active').eq('teacher_id',user.id).eq('name',name).limit(1);
  if(findError)throw new Error('خواندن کلاس‌ها ناموفق بود: '+findError.message);
  if(existing&&existing.length)return existing[0];
  let code=String(db.settings.classCode||'2A').trim().toUpperCase()||'2A';
  let result=await client.from('classes').insert({teacher_id:user.id,name,class_code:code,is_active:true}).select('id,name,class_code,is_active').single();
  if(result.error && result.error.code==='23505'){
    code=('K'+Math.random().toString(36).slice(2,8)).toUpperCase();
    result=await client.from('classes').insert({teacher_id:user.id,name,class_code:code,is_active:true}).select('id,name,class_code,is_active').single();
  }
  if(result.error)throw new Error('ساخت کلاس آنلاین ناموفق بود: '+result.error.message);
  if(name===db.settings.className && result.data.class_code){db.settings.classCode=result.data.class_code;persist();}
  return result.data;
}
async function refreshRemoteExams(showToast=true){
  if(examSyncInFlight)return;
  examSyncInFlight=true;
  try{
    const localOnly=db.exams.filter(e=>!isUuid(e.id));
    const {client,user}=await getAuthenticatedSupabaseContext();
    const {data:examRows,error:examError}=await client.from('exams').select('*').eq('created_by',user.id).order('created_at',{ascending:false});
    if(examError)throw examError;
    const rows=examRows||[];
    const classIds=[...new Set(rows.map(e=>e.class_id).filter(Boolean))];
    let classes=[];
    if(classIds.length){const {data,error}=await client.from('classes').select('id,name,class_code').in('id',classIds);if(error)throw error;classes=data||[];}
    const classMap=new Map(classes.map(c=>[c.id,c]));
    const examIds=rows.map(e=>e.id);
    let links=[];
    if(examIds.length){const {data,error}=await client.from('exam_questions').select('id,exam_id,question_id,position,points,question_snapshot').in('exam_id',examIds).order('position',{ascending:true});if(error)throw error;links=data||[];}
    const grouped=new Map();
    links.forEach(link=>{if(!grouped.has(link.exam_id))grouped.set(link.exam_id,[]);grouped.get(link.exam_id).push(link);});
    const remote=rows.map(row=>{
      const klass=classMap.get(row.class_id);
      const qids=(grouped.get(row.id)||[]).sort((a,b)=>a.position-b.position).map(link=>link.question_id);
      return {id:row.id,title:row.title,lesson:row.subject||'عمومی',subject:row.subject||'عمومی',description:row.description||'',classId:row.class_id,className:klass?.name||'کلاس ثبت‌شده',classCode:klass?.class_code||'',active:row.status==='published',status:row.status,questionIds:qids,allowRetakes:!!row.allow_retakes,startsAt:row.starts_at,endsAt:row.ends_at,durationMinutes:row.duration_minutes,createdAt:row.created_at,updatedAt:row.updated_at,online:true};
    });
    db.exams=[...remote,...localOnly];
    persist();
    examCloudState={connected:true,rowCount:remote.length,message:`اتصال آزمون‌ها برقرار است؛ ${faNum(remote.length)} آزمون از پایگاه آنلاین دریافت شد.`+(localOnly.length?` ${faNum(localOnly.length)} آزمون محلی هنوز منتقل نشده است.`:''),kind:'success'};
    if(showToast)toast('فهرست آزمون‌ها از پایگاه آنلاین دریافت شد.');
  }catch(error){
    console.error('Refresh online exams failed:',error);
    examCloudState={...examCloudState,connected:false,message:'دریافت آزمون‌ها ناموفق بود: '+(error.message||String(error)),kind:'error'};
    if(showToast)toast(examCloudState.message);
  }finally{
    examSyncInFlight=false;
    if(adminLogged&&adminTab==='exams')adminDashboard();
  }
}
function mapLocalQuestionSnapshot(q){
  const typeMap={mcq:'multiple_choice',tf:'true_false',fill:'fill_blank',short:'short_text'};
  return {id:q.id,code:q.code,subject:q.subject||'عمومی',question_text:q.text||'',question_type:typeMap[q.type]||'short_text',options:Array.isArray(q.options)?q.options:[],correct_answer:q.correct===''||q.correct==null?null:String(q.correct),explanation:q.help||null,default_points:Number(q.points??1)};
}
function bindExamForm(){const form=$('#exam-form');if(form&&!form.dataset.bound){form.dataset.bound='1';form.addEventListener('submit',saveExam);}}
async function saveExam(e){
  e.preventDefault();
  const form=e.currentTarget,fd=new FormData(form),id=String(fd.get('id')||''),questionIds=fd.getAll('questionIds').map(String);
  if(!questionIds.length){toast('حداقل یک سؤال انتخاب کن.');return;}
  const title=String(fd.get('title')||'').trim(),lesson=String(fd.get('lesson')||'عمومی').trim()||'عمومی',description=String(fd.get('description')||'').trim(),className=String(fd.get('className')||'').trim(),active=fd.get('active')==='true';
  if(!title||!className){toast('نام آزمون و کلاس را وارد کن.');return;}
  const old=id?db.exams.find(x=>String(x.id)===id):null;
  const exLocal={id:id||uid('exam'),title,lesson,description,className,active,questionIds,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
  if(!isSupabaseConfigured()){
    if(old)db.exams=db.exams.map(x=>String(x.id)===id?exLocal:x);else db.exams.push(exLocal);
    persist();editingExamId=null;toast(old?'آزمون محلی ویرایش شد.':'آزمون محلی ساخته شد. برای ذخیره آنلاین، اتصال Supabase را فعال کن.');adminDashboard();return;
  }
  try{
    const localQuestionIds=questionIds.filter(qid=>!isUuid(qid));
    if(localQuestionIds.length)throw new Error('برای ذخیره آنلاین، بعضی سؤال‌های انتخاب‌شده هنوز محلی هستند. از بخش سؤال‌ها دکمه «انتقال سؤال‌های محلی به پایگاه آنلاین» را اجرا و سپس آزمون را دوباره ذخیره کن.');
    const questionMap=new Map(db.questions.filter(q=>isUuid(q.id)).map(q=>[String(q.id),q]));
    const missing=questionIds.filter(qid=>!questionMap.has(qid));
    if(missing.length)throw new Error('یک یا چند سؤال انتخاب‌شده در فهرست آنلاین فعلی وجود ندارند. ابتدا سؤال‌ها را از پایگاه آنلاین تازه‌سازی کن.');
    const {client,user}=await getAuthenticatedSupabaseContext();
    const {data:ownedQuestions,error:qErr}=await client.from('questions').select('id').in('id',questionIds).eq('teacher_id',user.id);
    if(qErr)throw new Error('بررسی مالکیت سؤال‌ها ناموفق بود: '+qErr.message);
    if((ownedQuestions||[]).length!==new Set(questionIds).size)throw new Error('همه سؤال‌های انتخاب‌شده متعلق به این حساب معلم نیستند یا در پایگاه آنلاین قابل دسترسی نیستند.');
    const classRow=await ensureRemoteClass(client,user,className);
    let existingLinks=[];
    let hasSubmissions=false;
    if(old&&isUuid(old.id)){
      const {data:submissions,error:subErr}=await client.from('submissions').select('id').eq('exam_id',old.id).limit(1);
      if(subErr)throw new Error('بررسی پاسخ‌نامه‌های قبلی ناموفق بود: '+subErr.message);
      hasSubmissions=!!(submissions&&submissions.length);
      const {data:links,error:linksErr}=await client.from('exam_questions').select('question_id,position').eq('exam_id',old.id).order('position',{ascending:true});
      if(linksErr)throw new Error('خواندن سؤال‌های آزمون ناموفق بود: '+linksErr.message);
      existingLinks=links||[];
      const prevIds=existingLinks.map(x=>String(x.question_id));
      const sameQuestions=prevIds.length===questionIds.length&&prevIds.every((qid,i)=>qid===questionIds[i]);
      if(hasSubmissions&&!sameQuestions)throw new Error('برای این آزمون پاسخ‌نامه آنلاین ثبت شده است؛ برای حفظ سوابق، فهرست یا ترتیب سؤال‌ها را تغییر نده. می‌توانی فقط عنوان، توضیح، کلاس یا وضعیت انتشار را تغییر دهی.');
    }
    const payload={class_id:classRow.id,created_by:user.id,title,subject:lesson,description:description||null,status:active?'published':'draft',allow_retakes:!!db.settings.allowRetry};
    let savedRow;
    if(old&&isUuid(old.id)){
      const {data,error}=await client.from('exams').update(payload).eq('id',old.id).eq('created_by',user.id).select('*').single();
      if(error)throw error;savedRow=data;
    }else{
      const {data,error}=await client.from('exams').insert(payload).select('*').single();
      if(error)throw error;savedRow=data;
    }
    const prevIds=existingLinks.map(x=>String(x.question_id));
    const sameQuestions=prevIds.length===questionIds.length&&prevIds.every((qid,i)=>qid===questionIds[i]);
    if(!(old&&isUuid(old.id)&&hasSubmissions&&sameQuestions)){
      const {error:deleteLinksError}=await client.from('exam_questions').delete().eq('exam_id',savedRow.id);
      if(deleteLinksError)throw new Error('ذخیره اطلاعات آزمون انجام شد، اما پاک‌سازی ارتباط‌های قبلی سؤال‌ها ناموفق بود: '+deleteLinksError.message);
      const linkPayload=questionIds.map((qid,index)=>{const q=questionMap.get(qid);return {exam_id:savedRow.id,question_id:qid,position:index+1,points:Number(q.points??1),question_snapshot:mapLocalQuestionSnapshot(q)};});
      const {error:insertLinksError}=await client.from('exam_questions').insert(linkPayload);
      if(insertLinksError)throw new Error('آزمون ساخته یا ویرایش شد، اما اتصال سؤال‌ها ناموفق بود: '+insertLinksError.message);
    }
    const saved={...exLocal,id:savedRow.id,classId:classRow.id,classCode:classRow.class_code,status:savedRow.status,active:savedRow.status==='published',online:true,createdAt:savedRow.created_at,updatedAt:savedRow.updated_at};
    db.exams=db.exams.filter(x=>String(x.id)!==id&&String(x.id)!==String(saved.id));
    db.exams.unshift(saved);persist();editingExamId=null;
    examCloudState={connected:true,rowCount:db.exams.filter(x=>isUuid(x.id)).length,message:'آزمون و ارتباط سؤال‌های آن با موفقیت در پایگاه آنلاین ذخیره شد.',kind:'success'};
    await refreshRemoteExams(false);adminDashboard();toast(old?'تغییرات آزمون در پایگاه آنلاین ذخیره شد.':'آزمون در پایگاه آنلاین ساخته شد.');
  }catch(error){
    console.error('Save online exam failed:',error);
    setExamCloudNotice('ذخیره آنلاین آزمون ناموفق بود: '+(error.message||String(error)),'error');
    toast('ذخیره آنلاین آزمون ناموفق بود: '+(error.message||String(error)));
  }
}

async function toggleExam(id){
  const ex=db.exams.find(x=>String(x.id)===String(id));if(!ex)return;
  const nextActive=!ex.active;
  if(isUuid(ex.id)&&isSupabaseConfigured()){

function bindStudentForm(){const form=$('#student-form');if(!form||form.dataset.bound==='1')return;form.dataset.bound='1';form.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(form),name=String(fd.get('name')||'').trim(),code=String(fd.get('code')||'').trim(),className=String(fd.get('className')||'').trim(),pin=String(fd.get('pin')||'').trim(),active=fd.get('active')==='true';const button=form.querySelector('button[type="submit"]');if(!isSupabaseConfigured()){toast('ابتدا اتصال Supabase را تنظیم کنید.');return;}if(!/^\d{4,12}$/.test(pin)){toast('PIN باید بین ۴ تا ۱۲ رقم باشد.');return;}if(db.students.some(st=>String(st.code).toLowerCase()===code.toLowerCase()&&st.className===className)){toast('این کد دانش‌آموز در فهرست فعلی وجود دارد.');return;}button.disabled=true;button.textContent='در حال ثبت...';try{const result=await invokeStudentApi('teacher-create-student',{name,studentCode:code,className,classCode:db.settings.classCode,pin,active});const st=result.student;db.students=[{id:st.id,name:st.fullName,code:st.studentCode,className:st.className,classId:st.classId,classCode:st.classCode,active:st.active,createdAt:st.createdAt,online:true},...db.students.filter(x=>x.id!==st.id)];toast('دانش‌آموز آنلاین ثبت شد. کد کلاس: '+st.classCode);adminDashboard();}catch(error){console.error(error);toast('ثبت دانش‌آموز ناموفق بود: '+(error.message||String(error)));}finally{button.disabled=false;button.textContent='ثبت دانش‌آموز در پایگاه آنلاین';const pinInput=form.querySelector('[name="pin"]');if(pinInput)pinInput.value='';}})}

function copySubmission(id){const s=db.submissions.find(x=>x.id===id);if(!s)return;copyText(submissionText(s))}async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('متن کپی شد.')}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'متن کپی شد.':'کپی خودکار نشد؛ متن را دستی کپی کن.')}}catch(e){toast('کپی انجام نشد؛ از روش دستی استفاده کن.')}}function openSms(id){const s=db.submissions.find(x=>x.id===id);if(!s)return;const phone=String(db.settings.teacherPhone||'').trim();if(!phone){toast('ابتدا شماره تلفن معلم را در تنظیمات وارد کن.');adminTab='settings';adminDashboard();return}const number=phone.replace(/[^0-9+]/g,'');const isApple=/iPad|iPhone|iPod/i.test(navigator.userAgent);const separator=isApple?'&':'?';const url='sms:'+number+separator+'body='+encodeURIComponent(submissionText(s));try{const a=document.createElement('a');a.href=url;a.style.display='none';document.body.appendChild(a);a.click();a.remove();toast('برنامه پیامک باز می‌شود؛ ارسال را در گوشی تأیید کن.')}catch(e){toast('باز کردن پیامک ممکن نشد؛ از دکمه کپی گزارش استفاده کن.')}}
function settingsTab(){return `<section class="panel"><div class="section-head"><h3>تنظیمات برنامه</h3><span class="pill warning">ذخیره محلی</span></div><form id="settings-form"><div class="form-grid"><div class="field span-2"><label>نام برنامه</label><input name="appName" required value="${esc(db.settings.appName)}"></div><div class="field"><label>نام معلم</label><input name="teacherName" value="${esc(db.settings.teacherName)}"></div><div class="field"><label>شماره تلفن معلم برای پیامک</label><input name="teacherPhone" type="tel" value="${esc(db.settings.teacherPhone)}" placeholder="مثلاً 09..." dir="ltr"></div><div class="field"><label>نام کلاس پیش‌فرض</label><input name="className" required value="${esc(db.settings.className)}"></div><div class="field"><label>کد ورود کلاس</label><input name="classCode" required value="${esc(db.settings.classCode)}" dir="ltr"></div><div class="field"><label>رمز محلی معلم</label><input name="adminPin" required minlength="4" value="${esc(db.settings.adminPin)}" dir="ltr"></div><div class="field"><label>اجازه ثبت مجدد آزمون</label><select name="allowRetry"><option value="false" ${!db.settings.allowRetry?'selected':''}>خیر، یک پاسخ‌نامه برای هر آزمون</option><option value="true" ${db.settings.allowRetry?'selected':''}>بله، ثبت مجدد مجاز است</option></select></div></div><button class="btn primary" type="submit">ذخیره تنظیمات</button></form><div class="notice danger-notice"><b>هشدار امنیتی:</b> تغییر رمز در این فایل فقط یک سد ساده در رابط کاربری است؛ اطلاعات و کدها در فایل و مرورگر قابل دسترسی‌اند. این نسخه را برای اطلاعات حساس در اینترنت منتشر نکنید.</div></section><section class="section panel"><div class="section-head"><h3>آزمایش اتصال به Supabase</h3><span class="pill warning">فقط آزمایش اتصال</span></div><div class="notice info">آدرس پروژه و کلید عمومی را وارد کنید، سپس با حساب معلم Supabase آزمایش کنید. پس از اتصال موفق، نشست ورود معلم در همین مرورگر نگهداری می‌شود و بخش‌های «سؤال‌ها» و «آزمون‌ها» برای خواندن و ذخیره تغییرات به پایگاه آنلاین متصل هستند. ورود آنلاین دانش‌آموزان و ثبت پاسخ‌نامه‌ها از student-api استفاده می‌کند؛ برای فعال‌شدن، تابع باید در Supabase منتشر و کلید عمومی در فایل HTML مشترک تنظیم شده باشد.</div><form id="supabase-test-form"><div class="field"><label for="supabase-url">Project URL</label><input id="supabase-url" name="supabaseUrl" type="url" dir="ltr" autocomplete="url" required placeholder="https://xxxxxxxx.supabase.co" value="${esc(loadSupabaseConfig().url)}"></div><div class="field"><label for="supabase-key">Publishable key یا anon key عمومی</label><input id="supabase-key" name="supabaseKey" type="text" dir="ltr" autocomplete="off" spellcheck="false" required placeholder="sb_publishable_... یا کلید عمومی قدیمی" value="${esc(loadSupabaseConfig().key)}"></div><div class="field"><label for="supabase-test-email">ایمیل حساب معلم در Supabase Auth</label><input id="supabase-test-email" name="testEmail" type="email" dir="ltr" autocomplete="username" required placeholder="teacher@example.com"></div><div class="field"><label for="supabase-test-password">رمز حساب معلم</label><input id="supabase-test-password" name="testPassword" type="password" autocomplete="current-password" required placeholder="رمز حساب Supabase"></div><button class="btn primary" type="submit">آزمایش اتصال</button><div id="supabase-test-status" class="notice info" role="status" aria-live="polite">پس از واردکردن اطلاعات، روی «آزمایش اتصال» بزنید.</div></form><p class="small muted">آدرس و کلید عمومی در همین مرورگر ذخیره می‌شوند؛ رمز عبور ذخیره نمی‌شود. کلید service_role یا secret را هرگز وارد نکنید. برای آزمایش از Live Server یا یک سایت HTTPS استفاده کنید.</p></section><section class="section panel"><div class="section-head"><h3>پشتیبان‌گیری و مدیریت اطلاعات</h3></div><div class="inline"><button class="btn teal" onclick="exportBackup()">دانلود پشتیبان JSON</button><label class="btn secondary" for="importSettingsFile">بازیابی از فایل JSON</label><input id="importSettingsFile" type="file" accept="application/json,.json" class="hidden"></div><hr class="divider"><div class="danger-zone"><h3 style="margin-top:0">بازگردانی نسخه نمونه</h3><p class="small">تمام داده‌های فعلی این برنامه در همین مرورگر با داده‌های نمونه جایگزین می‌شوند. پیش از ادامه پشتیبان بگیرید.</p><button class="btn danger" onclick="resetApp()">پاک‌کردن و بازگردانی داده نمونه</button></div></section>`}
function bindSettingsForm(){const form=$('#settings-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(form);db.settings={...db.settings,appName:String(fd.get('appName')).trim(),teacherName:String(fd.get('teacherName')).trim(),teacherPhone:String(fd.get('teacherPhone')).trim(),className:String(fd.get('className')).trim(),classCode:String(fd.get('classCode')).trim(),adminPin:String(fd.get('adminPin')).trim(),allowRetry:fd.get('allowRetry')==='true'};persist();adminDashboard();toast('تنظیمات ذخیره شد.')});bindSupabaseTestForm();bindImportFile()}
function bindSupabaseTestForm(){const form=$('#supabase-test-form');if(!form||form.dataset.bound==='1')return;form.dataset.bound='1';form.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(form);const url=String(fd.get('supabaseUrl')||'').trim();const key=String(fd.get('supabaseKey')||'').trim();const email=String(fd.get('testEmail')||'').trim();const password=String(fd.get('testPassword')||'');const button=form.querySelector('button[type="submit"]');if(button){button.disabled=true;button.textContent='در حال آزمایش...'}setSupabaseTestStatus('در حال بررسی آدرس، ورود معلم و دسترسی به جدول questions...','info');try{localStorage.setItem(SUPABASE_CONFIG_STORE_KEY,JSON.stringify({url,key}));const result=await runSupabaseConnectionTest(email,password,url,key);setSupabaseTestStatus('اتصال موفق بود. ورود معلم انجام شد و جدول questions قابل خواندن است. تعداد ردیف‌های قابل مشاهده در این آزمایش: '+result.count+'.','success');}catch(error){console.error('Supabase connection test failed:',error);setSupabaseTestStatus(error&&error.message?error.message:'خطای ناشناخته در اتصال به Supabase. جزئیات را در Console ببینید.','error');}finally{const pass=form.querySelector('#supabase-test-password');if(pass)pass.value='';if(button){button.disabled=false;button.textContent='آزمایش اتصال'}}})}
function bindImportFile(){['importJsonFile','importSettingsFile'].forEach(id=>{const el=$('#'+id);if(el&&!el.dataset.bound){el.dataset.bound='1';el.addEventListener('change',handleImport)}})}
function exportBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'});downloadBlob(blob,'kelas-shad-man-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('فایل پشتیبان آماده شد.')}
function handleImport(e){const file=e.target.files?.[0];if(!file)return;if(!confirm('اطلاعات فعلی با اطلاعات فایل جایگزین شود؟ ابتدا مطمئن شو پشتیبان داری.')){e.target.value='';return}const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x||!x.settings||!Array.isArray(x.questions)||!Array.isArray(x.exams)||!Array.isArray(x.students)||!Array.isArray(x.submissions))throw new Error('ساختار فایل درست نیست');db={...initialState(),...x,settings:{...initialState().settings,...x.settings}};persist();editingQuestionId=null;editingExamId=null;toast('پشتیبان بازیابی شد.');adminDashboard()}catch(err){toast('فایل معتبر نیست یا ساختار پشتیبان را ندارد.')}e.target.value=''};reader.readAsText(file)}
function exportStudentsCSV(){const rows=[['نام دانش‌آموز','کلاس','کد دانش‌آموز','وضعیت'],...db.students.map(s=>[s.name,s.className,s.code,s.active?'فعال':'غیرفعال'])];downloadBlob(new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'students.csv')}
function exportResponsesCSV(){const rows=[['شناسه پاسخ‌نامه','دانش‌آموز','کلاس','آزمون','تاریخ ثبت','کد سؤال','متن سؤال','پاسخ','درست/نادرست','نمره سؤال']];db.submissions.forEach(s=>(s.answers||[]).forEach(a=>rows.push([s.id,s.studentName,s.className,s.examTitle,s.submittedAtLabel,a.code,a.questionText,a.answer,a.autoGraded?(a.correct?'درست':'نادرست'):'نیازمند بررسی',a.points])));downloadBlob(new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'responses.csv');toast('گزارش CSV آماده شد.')}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function resetApp(){if(!confirm('همه اطلاعات فعلی حذف و داده نمونه جایگزین شود؟'))return;db=initialState();persist();adminLogged=false;adminTab='overview';editingQuestionId=null;editingExamId=null;adminDashboard();toast('برنامه به داده نمونه بازگشت.')}

Object.assign(window, {

  cancelQuestionEdit, toggleQuestion, deleteQuestion, refreshRemoteQuestions, syncLocalQuestionsToSupabase, editExam, cancelExamEdit,
  toggleExam, deleteExam, toggleStudent, deleteStudent, exportStudentsCSV,
  exportResponsesCSV, exportBackup, handleImport, resetApp, showSubmission,
  closeModal, saveFeedback, copySubmission, openSms, filterResponseRows, studentLogoutToLogin, returnToOnlineStudentDashboard, refreshRemoteStudents, refreshRemoteSubmissions
});

// اگر نشست معتبر دانش‌آموز در همین تب ذخیره شده باشد، آن را بازیابی کن؛ وگرنه صفحه آغازین را نشان بده.
if (studentSession && studentSession.token && isSupabaseConfigured()) {
  loadOnlineStudentData().then(() => studentDashboard()).catch(error => { console.warn('Student session restore skipped:', error); clearStudentSession(); home(); });
} else { home(); }
